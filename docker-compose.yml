version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hostclient_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - hostclient
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:alpine
    container_name: hostclient_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    networks:
      - hostclient
    depends_on:
      - app

  db:
    image: mariadb:11.2
    container_name: hostclient_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
    volumes:
      - dbdata:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/my.cnf
    networks:
      - hostclient
    ports:
      - "3306:3306"

  redis:
    image: redis:alpine
    container_name: hostclient_redis
    restart: unless-stopped
    networks:
      - hostclient
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit
    container_name: hostclient_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - hostclient

networks:
  hostclient:
    driver: bridge

volumes:
  dbdata:
    driver: local
