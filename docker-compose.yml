version: '3.8'

services:
  # Application PHP
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PHP_VERSION: 8.4
    container_name: hostclient_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - hostclient
    depends_on:
      - mysql
      - redis
    environment:
      - DB_HOST=mysql
      - DB_DATABASE=hostclient
      - DB_USERNAME=hostclient
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PASSWORD=null
      - REDIS_PORT=6379

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: hostclient_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - ./docker/nginx/ssl:/etc/nginx/ssl
    networks:
      - hostclient
    depends_on:
      - app

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: hostclient_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: hostclient
      MYSQL_USER: hostclient
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root_secret
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - hostclient
    command: --default-authentication-plugin=mysql_native_password

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: hostclient_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - hostclient
    command: redis-server --appendonly yes

  # Queue Worker
  queue:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PHP_VERSION: 8.4
    container_name: hostclient_queue
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - hostclient
    depends_on:
      - mysql
      - redis
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600

  # Scheduler
  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PHP_VERSION: 8.4
    container_name: hostclient_scheduler
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - hostclient
    depends_on:
      - mysql
      - redis
    command: /bin/sh -c "while true; do php artisan schedule:run --verbose --no-interaction & sleep 60; done"

  # Node.js for asset compilation
  node:
    image: node:20-alpine
    container_name: hostclient_node
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - hostclient
    command: sh -c "npm install && npm run dev"

  # Mailpit (pour tester les emails en développement)
  mailpit:
    image: axllent/mailpit
    container_name: hostclient_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - hostclient

networks:
  hostclient:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
